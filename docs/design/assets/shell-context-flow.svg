<path d="M835 619L859 619" fill="none" stroke="#586472" stroke-width="1.5"/>
<path d="M853 614L859 619" fill="none" stroke="#586472" stroke-width="1.5"/>
<path d="M853 624L859 619" fill="none" stroke="#586472" stroke-width="1.5"/>
<rect x="880" y="478" width="244" height="345" rx="15" fill="#ffffff" stroke="#d6dce2"/>
<rect x="881" y="479" width="242" height="47" rx="14" fill="#f7f8f9"/>
<text x="894" y="509" font-size="15" fill="#20262e" font-weight="400">‹ 对象 A</text>
<path d="M880 526L1124 526" fill="none" stroke="#d6dce2" stroke-width="1"/>
<text x="897" y="564" font-size="19" fill="#20262e" font-weight="500">A 的想法</text>
<rect x="897" y="583" width="210" height="30" rx="5" fill="#f7f8f9"/>
<text x="907" y="604" font-size="13" fill="#586472" font-weight="500">目标：A · 未保存</text>
<rect x="897" y="629" width="210" height="104" rx="4" fill="#eef3f8" stroke="#d6dce2"/>
<text x="908" y="660" font-size="14" fill="#20262e" font-weight="400">同一份草稿…</text>
<text x="897" y="768" font-size="13" fill="#586472" font-weight="400">键盘与输入焦点继续</text>
<text x="897" y="804" font-size="12" fill="#586472" font-weight="400">返回恢复 A 的原位置</text>
<rect x="1148" y="478" width="244" height="345" rx="15" fill="#ffffff" stroke="#d6dce2"/>
<rect x="1149" y="479" width="242" height="47" rx="14" fill="#f7f8f9"/>
<text x="1162" y="509" font-size="15" fill="#20262e" font-weight="400">‹ 工作区</text>
<path d="M1148 526L1392 526" fill="none" stroke="#d6dce2" stroke-width="1"/>
<text x="1165" y="564" font-size="19" fill="#20262e" font-weight="500">对象 A</text>
<path d="M1165 596L1375 596" fill="none" stroke="#d6dce2" stroke-width="1"/>
<path d="M1165 617L1375 617" fill="none" stroke="#d6dce2" stroke-width="1"/>
