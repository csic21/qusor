<text x="1165" y="804" font-size="12" fill="#586472" font-weight="400">工具可从同一入口再打开</text>
<text x="880" y="855" font-size="14" fill="#20262e" font-weight="400">紧凑：工具页  →  系统返回  →  原对象</text>
<text x="48" y="824" font-size="15" fill="#586472" font-weight="400">导航、主内容与工具均须满足最小可用空间。</text>
<text x="48" y="854" font-size="15" fill="#586472" font-weight="400">字号增大或窗口缩小时，保留正在输入的区域与其目标。</text>
<path d="M48 893L1392 893" fill="none" stroke="#d6dce2" stroke-width="1"/>
<text x="48" y="931" font-size="17" fill="#20262e" font-weight="500">返回</text>
