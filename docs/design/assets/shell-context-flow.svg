<text x="393" y="962" font-size="13" fill="#586472" font-weight="400">保留对象；处理未保存输入</text>
<text x="738" y="931" font-size="17" fill="#20262e" font-weight="500">隐藏工具</text>
<text x="738" y="962" font-size="13" fill="#586472" font-weight="400">不等于停止活动</text>
