<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1030" viewBox="0 0 1440 1030" role="img">
<title>切换工作，保留对象、输入和返回路径</title><desc>交互研究 v0.3 · 先定义状态转移，再做视觉表现 · 所有流程均待原生验证</desc>
<g font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1440" height="1030" rx="0" fill="#f2f3f5"/>
<text x="48" y="52" font-size="28" fill="#20262e" font-weight="600">切换工作，保留对象、输入和返回路径</text>
<text x="48" y="84" font-size="15" fill="#586472" font-weight="400">交互研究 v0.3 · 先定义状态转移，再做视觉表现 · 所有流程均待原生验证</text>
<text x="48" y="130" font-size="22" fill="#20262e" font-weight="600">写给 A 的输入，不能因为切到 B 就改了目标</text>
<text x="48" y="162" font-size="15" fill="#20262e" font-weight="500">1. 打开 A</text>
<rect x="48" y="181" width="309" height="213" rx="6" fill="#ffffff" stroke="#d6dce2"/>
<rect x="49" y="182" width="307" height="35" rx="5" fill="#f7f8f9"/>
<text x="61" y="206" font-size="14" fill="#20262e" font-weight="400">主视图 A</text>
<rect x="63" y="238" width="279" height="41" rx="5" fill="#e7edf4"/>
<text x="75" y="265" font-size="14" fill="#315c85" font-weight="500">工具：跟随 A</text>
<text x="63" y="316" font-size="13" fill="#586472" font-weight="400">还没有未提交输入</text>
<path d="M63 339L342 339" fill="none" stroke="#d6dce2" stroke-width="1"/>
<text x="63" y="366" font-size="12" fill="#586472" font-weight="400">同一视图 / 草稿身份保持</text>
<path d="M363 282L387 282" fill="none" stroke="#586472" stroke-width="1.5"/>
<path d="M381 277L387 282" fill="none" stroke="#586472" stroke-width="1.5"/>
<path d="M381 287L387 282" fill="none" stroke="#586472" stroke-width="1.5"/>
<text x="393" y="162" font-size="15" fill="#20262e" font-weight="500">2. 开始输入</text>
<rect x="393" y="181" width="309" height="213" rx="6" fill="#ffffff" stroke="#d6dce2"/>
<rect x="394" y="182" width="307" height="35" rx="5" fill="#f7f8f9"/>
<text x="406" y="206" font-size="14" fill="#20262e" font-weight="400">主视图 A</text>
<rect x="408" y="238" width="279" height="41" rx="5" fill="#e7edf4"/>
<text x="420" y="265" font-size="14" fill="#315c85" font-weight="500">工具：固定到 A</text>
<text x="408" y="316" font-size="13" fill="#586472" font-weight="400">草稿绑定 A 与其版本</text>
<path d="M408 339L687 339" fill="none" stroke="#d6dce2" stroke-width="1"/>
<text x="408" y="366" font-size="12" fill="#586472" font-weight="400">同一视图 / 草稿身份保持</text>
<path d="M708 282L732 282" fill="none" stroke="#586472" stroke-width="1.5"/>
<path d="M726 277L732 282" fill="none" stroke="#586472" stroke-width="1.5"/>
<path d="M726 287L732 282" fill="none" stroke="#586472" stroke-width="1.5"/>
<text x="738" y="162" font-size="15" fill="#20262e" font-weight="500">3. 激活 B</text>
<rect x="738" y="181" width="309" height="213" rx="6" fill="#ffffff" stroke="#d6dce2"/>
<rect x="739" y="182" width="307" height="35" rx="5" fill="#f7f8f9"/>
<text x="751" y="206" font-size="14" fill="#20262e" font-weight="400">主视图 B</text>
<rect x="753" y="238" width="279" height="41" rx="5" fill="#faf2e6"/>
<text x="765" y="265" font-size="14" fill="#805222" font-weight="500">草稿仍属于 A</text>
<text x="753" y="316" font-size="13" fill="#586472" font-weight="400">不自动把文字发给 B</text>
<path d="M753 339L1032 339" fill="none" stroke="#d6dce2" stroke-width="1"/>
<text x="753" y="366" font-size="12" fill="#586472" font-weight="400">同一视图 / 草稿身份保持</text>
<path d="M1053 282L1077 282" fill="none" stroke="#586472" stroke-width="1.5"/>
<path d="M1071 277L1077 282" fill="none" stroke="#586472" stroke-width="1.5"/>
<path d="M1071 287L1077 282" fill="none" stroke="#586472" stroke-width="1.5"/>
<text x="1083" y="162" font-size="15" fill="#20262e" font-weight="500">4. 明确处理</text>
<rect x="1083" y="181" width="309" height="213" rx="6" fill="#ffffff" stroke="#d6dce2"/>
<rect x="1084" y="182" width="307" height="35" rx="5" fill="#f7f8f9"/>
<text x="1096" y="206" font-size="14" fill="#20262e" font-weight="400">返回 A / 保存后切换</text>
<rect x="1098" y="238" width="279" height="41" rx="5" fill="#faf2e6"/>
<text x="1110" y="265" font-size="14" fill="#805222" font-weight="500">保留或提交原草稿</text>
<text x="1098" y="316" font-size="13" fill="#586472" font-weight="400">只有用户动作能改变目标</text>
<path d="M1098 339L1377 339" fill="none" stroke="#d6dce2" stroke-width="1"/>
<text x="1098" y="366" font-size="12" fill="#586472" font-weight="400">同一视图 / 草稿身份保持</text>
<text x="48" y="449" font-size="22" fill="#20262e" font-weight="600">空间不足时改变安放，不重建业务、不重发执行</text>
<rect x="48" y="478" width="770" height="295" rx="7" fill="#ffffff" stroke="#d6dce2"/>
<rect x="49" y="479" width="768" height="38" rx="6" fill="#f7f8f9"/>
