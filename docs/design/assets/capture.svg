<g font-family="Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1440" height="1000" rx="0" fill="#E6E8E1"/>
<text x="64" y="49" font-size="26" fill="#242824" font-weight="600">写想法 · 引用、观点与状态分开</text>
<text x="64" y="78" font-size="14" fill="#596159" font-weight="400">④ 辅助面板由用户主动打开；当前编辑器可通过更多菜单选择兼容提供者</text>
