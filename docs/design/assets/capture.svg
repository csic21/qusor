<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img">
<title>写想法 · 引用、观点与状态分开</title><desc>④ 辅助面板由用户主动打开；当前编辑器可通过更多菜单选择兼容提供者</desc>
