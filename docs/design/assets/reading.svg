<g font-family="Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1440" height="1000" rx="0" fill="#E6E8E1"/>
<text x="64" y="49" font-size="26" fill="#242824" font-weight="600">阅读 · 内容优先，工具按需</text>
<text x="64" y="78" font-size="14" fill="#596159" font-weight="400">默认收起目录与编辑区；保留返回路径、文档身份和阅读控制</text>
