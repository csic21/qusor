<g clip-path="url(#body)">
<rect x="380" y="192" width="736" height="970" rx="1" fill="#FFFFFF" stroke="#E5E5DE"/>
<text x="436" y="245" font-size="12" fill="#596159" font-weight="400">第二章  阅读与理解</text>
<path d="M436 262L1060 262" stroke="#D9DDD5" fill="none"/>
<text x="436" y="318" font-size="27" fill="#242824" font-weight="500">理解，始于建立联系</text>
<text x="436" y="367" font-size="16" fill="#303630" font-weight="400">阅读时，我们常常把注意力放在信息本身：一句话说了什么，</text>
<text x="436" y="399" font-size="16" fill="#303630" font-weight="400">一段论证得出了怎样的结论。然而，理解还需要另一个过程。</text>
<text x="436" y="431" font-size="16" fill="#303630" font-weight="400">它要求我们把新材料放回自己的问题与经验之中。</text>
<text x="436" y="483" font-size="16" fill="#303630" font-weight="400">理解不是把句子存起来，而是知道它与已有经验如何联系。</text>
<text x="436" y="515" font-size="16" fill="#303630" font-weight="400">当我们能够说明这份联系，也就更容易发现遗漏与分歧。</text>
<text x="436" y="567" font-size="16" fill="#303630" font-weight="400">因此，一段摘录应当保留来处，一份想法应当表达自己的判断。</text>
<text x="436" y="599" font-size="16" fill="#303630" font-weight="400">两者相互关联，又能够分别被检查。回到原文核对时，我们</text>
<text x="436" y="631" font-size="16" fill="#303630" font-weight="400">需要看到当时的上下文，而不只是孤立的一句话。</text>
<text x="436" y="683" font-size="16" fill="#303630" font-weight="400">这种工作方式并不要求在每次阅读后写下很多文字。一个具体</text>
<text x="436" y="715" font-size="16" fill="#303630" font-weight="400">的问题、一条反例，或者一个尚未确定的联系，已经足以让</text>
<text x="436" y="747" font-size="16" fill="#303630" font-weight="400">阅读向前走一步。</text>
<text x="436" y="819" font-size="18" fill="#242824" font-weight="500">阅读札记</text>
<text x="436" y="855" font-size="16" fill="#242824" font-weight="400">哪些地方与你原先的理解一致？哪些地方值得重新核对？</text>
</g>
<rect x="120" y="852" width="1256" height="52" rx="0" fill="#FBFBF8"/>
<path d="M120 852L1376 852" stroke="#D9DDD5" fill="none"/>
