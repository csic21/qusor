<text x="1184" y="884" font-size="13" fill="#596159" font-weight="400">适合宽度  ⌄</text>
<text x="1306" y="884" font-size="16" fill="#596159" font-weight="400">−   ＋</text>
<text x="64" y="942" font-size="14" fill="#596159" font-weight="400">工作区内容区承载 document.reader 角色；PDF保留原页，布局示例不代表长书或可重排格式已验收。</text>
<text x="64" y="970" font-size="12" fill="#596159" font-weight="400">设计工作基线 v0.1 · 自拟示例内容 · 非运行截图 · 功能、长书与原生平台能力仍须分别验收</text>
</g></svg>
