[workspace]
resolver = "3"

[package]
name = "qusor-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false
description = "Public Rust SDK for QUSOR sandboxed Wasm plugins and declarative native UI slots."

[dependencies]
extension-api = { path = "../../crates/extension-api" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[lints.rust]
unsafe_code = "deny"
