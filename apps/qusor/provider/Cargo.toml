[workspace]
resolver = "3"

[package]
name = "qusor-pdf-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false
description = "Standalone PDFium page rendering and character mapping provider for QUSOR."

[dependencies]
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_8125"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
unicode-segmentation = "=1.13.3"
libc = "=0.2.191"

[lints.rust]
unsafe_code = "forbid"
