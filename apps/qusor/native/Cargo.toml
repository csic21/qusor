[workspace]
resolver = "3"

[package]
name = "qusor-app-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false
description = "QUSOR app native modules and the validated desktop composition."

[lib]
path = "src/lib.rs"

[dependencies]
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "913fd76e1f8434ec6cdf248f4476c1ebe08af19f" }
capability-composition = { path = "../../../crates/capability-composition" }
core-api = { path = "../../../crates/core-api" }
extension-api = { path = "../../../crates/extension-api" }
extension-host = { path = "../../../crates/extension-host" }
extension-package = { path = "../../../crates/extension-package" }
extension-runtime-api = { path = "../../../crates/extension-runtime-api" }
learning-application = { path = "../../../crates/learning-application" }
learning-ports = { path = "../../../crates/learning-ports" }
qusor-android-jni = { path = "../android-jni" }
qusor-app-bridges = { path = "../bridges" }
runtime-wasm = { path = "../../../adapters/runtime-wasm" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
storage-sqlite = { path = "../../../adapters/storage-sqlite" }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
png = "=0.18.1"
qusor-pdf-provider = { path = "../provider" }

[lints.rust]
unsafe_code = "forbid"
