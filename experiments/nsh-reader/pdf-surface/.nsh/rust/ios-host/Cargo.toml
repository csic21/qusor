[package]
name = "nsh-app-qusor-nsh-native-host-probe-ios-host"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "nsh-app-qusor-nsh-native-host-probe-ios-host"
path = "main.rs"

[dependencies]
nsh-ios-host = { path = "/workspace/qusor/experiments/nsh-reader/target/nsh/crates/nsh-ios-host" }
nsh-core = { path = "/workspace/qusor/experiments/nsh-reader/target/nsh/crates/nsh-core" }
nsh-base = { path = "/workspace/qusor/experiments/nsh-reader/target/nsh/crates/nsh-base", features = ["highlight"] }
app_qusor_nsh_native_host_probe = { package = "qusor-nsh-native-host-probe", path = "/workspace/qusor/experiments/nsh-reader/native-host" }

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { path = "/workspace/qusor/experiments/nsh-reader/target/nsh/crates/nsh-platform-ios" }
