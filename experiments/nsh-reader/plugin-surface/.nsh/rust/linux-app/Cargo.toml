[package]
name = "nsh-app-qusor-nsh-native-host-probe-linux-app"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "nsh-app-qusor-nsh-native-host-probe-linux-app"
path = "main.rs"

[dependencies]
nsh-linux-app = { path = "/workspace/qusor/experiments/nsh-reader/target/nsh/crates/nsh-linux-app" }
nsh-core = { path = "/workspace/qusor/experiments/nsh-reader/target/nsh/crates/nsh-core" }
nsh-base = { path = "/workspace/qusor/experiments/nsh-reader/target/nsh/crates/nsh-base", features = ["highlight"] }
app_qusor_nsh_native_host_probe = { package = "qusor-nsh-native-host-probe", path = "/workspace/qusor/experiments/nsh-reader/native-host" }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { path = "/workspace/qusor/experiments/nsh-reader/target/nsh/crates/nsh-platform-linux" }
