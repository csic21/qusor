# Generated by nsh for the app's Rust crate (nsh.json "rust"): do not edit.
[workspace]
resolver = "3"
members = ["describe", "test", "ios-host", "ios-app", "macos-host", "macos-app", "linux-host", "linux-app", "windows-host", "windows-app", "tui-host", "android", "web"]
# GPUI's hosts are a workspace of their own, written when they are built
# (`RustApp::gpui_workspace`): other builds never resolve GPUI's crates.
exclude = ["gpui"]

# The web runtime, as nsh builds its own (nsh's `Cargo.toml`): for size.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# The development web runtime (`nsh run --target web`): built again on
# every change to the app's Rust code, so incremental and without LTO; the
# app's crates at -O1, the others for size.
[profile.web-dev]
inherits = "dev"
opt-level = 1
debug = false
debug-assertions = false
overflow-checks = false
panic = "abort"
[profile.web-dev.package."*"]
opt-level = "s"
[profile.web-dev.package."qusor-nsh-native-host-probe"]
opt-level = 1

[profile.dev.package.quickjs-jit-sys]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.objc2]
opt-level = 3

[profile.dev.package.objc2-encode]
opt-level = 3

[patch.crates-io]
nsh-macros = { path = "../../../target/nsh/crates/nsh-macros" }
nsh-core = { path = "../../../target/nsh/crates/nsh-core" }
nsh-base = { path = "../../../target/nsh/crates/nsh-base" }
nsh-package = { path = "../../../target/nsh/crates/nsh-package" }
nsh-js = { path = "../../../target/nsh/crates/nsh-js" }
nsh-engine = { path = "../../../target/nsh/crates/nsh-engine" }
nsh-testing = { path = "../../../target/nsh/crates/nsh-testing" }
nsh-bundler = { path = "../../../target/nsh/crates/nsh-bundler" }
nsh-dev = { path = "../../../target/nsh/crates/nsh-dev" }
nsh-platform-apple = { path = "../../../target/nsh/crates/nsh-platform-apple" }
nsh-platform-ios = { path = "../../../target/nsh/crates/nsh-platform-ios" }
nsh-platform-android = { path = "../../../target/nsh/crates/nsh-platform-android" }
nsh-platform-linux = { path = "../../../target/nsh/crates/nsh-platform-linux" }
nsh-platform-macos = { path = "../../../target/nsh/crates/nsh-platform-macos" }
nsh-platform-windows = { path = "../../../target/nsh/crates/nsh-platform-windows" }
nsh-platform-web = { path = "../../../target/nsh/crates/nsh-platform-web" }
