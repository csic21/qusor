[package]
name = "nsh-app-qusor-nsh-native-host-probe-linux-host"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "nsh-app-qusor-nsh-native-host-probe-linux-host"
path = "main.rs"

[dependencies]
nsh-linux-host = { path = "../../../../target/nsh/crates/nsh-linux-host" }
nsh-core = { path = "../../../../target/nsh/crates/nsh-core" }
nsh-base = { path = "../../../../target/nsh/crates/nsh-base", features = ["highlight"] }
app_qusor_nsh_native_host_probe = { package = "qusor-nsh-native-host-probe", path = "../../../../native-host" }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { path = "../../../../target/nsh/crates/nsh-platform-linux" }
