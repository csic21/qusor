[package]
name = "nsh-app-qusor-nsh-native-host-probe-windows-app"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "nsh-app-qusor-nsh-native-host-probe-windows-app"
path = "main.rs"

[dependencies]
nsh-windows-app = { path = "../../../../target/nsh/crates/nsh-windows-app" }
nsh-core = { path = "../../../../target/nsh/crates/nsh-core" }
nsh-base = { path = "../../../../target/nsh/crates/nsh-base", features = ["highlight"] }
app_qusor_nsh_native_host_probe = { package = "qusor-nsh-native-host-probe", path = "../../../../native-host" }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { path = "../../../../target/nsh/crates/nsh-platform-windows" }
