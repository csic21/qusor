[workspace]
resolver = "3"

[package]
name = "qusor-capture-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false
description = "Isolated real capture/storage/anchor qualification, not production Core."

[dependencies]
learning-application = { path = "../../crates/learning-application" }
learning-ports = { path = "../../crates/learning-ports" }
storage-sqlite = { path = "../../adapters/storage-sqlite" }
core-api = { path = "../../crates/core-api" }
extension-api = { path = "../../crates/extension-api" }
extension-host = { path = "../../crates/extension-host" }
qusor-package-probe = { path = "../extension-package" }
qusor-wasm-probe = { path = "../extension-wasm/runner" }
serde_json = "=1.0.149"
libc = "=0.2.191"

[dev-dependencies]
runtime-process = { path = "../../adapters/runtime-process" }
extension-store = { path = "../../adapters/extension-store" }
extension-package = { path = "../../crates/extension-package" }
extension-runtime-api = { path = "../../crates/extension-runtime-api" }
runtime-wasm = { path = "../../adapters/runtime-wasm" }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
wat = "=1.228.0"

[lints.rust]
unsafe_code = "forbid"

[[test]]
name = "supervised_consumer"
path = "tests/supervised_consumer.rs"
harness = false

[[test]]
name = "component_text_consumer"
path = "tests/component_text_consumer.rs"
harness = false

[[test]]
name = "component_paragraph_consumer"
path = "tests/component_paragraph_consumer.rs"
harness = false

[[test]]
name = "component_projection_consumer"
path = "tests/component_projection_consumer.rs"
harness = false
