[workspace]
resolver = "3"

[package]
name = "qusor-package-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false
description = "Isolated signed package and persistence experiment; not a production installer."

[dependencies]
libc = "=0.2.191"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
extension-api = { path = "../../crates/extension-api" }
fs2 = "=0.4.3"
qusor-wasm-probe = { path = "../extension-wasm/runner" }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"