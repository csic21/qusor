# Directory inventory keeps independent code out of the production Workspace.
# Hidden directories (including .cache and .local) are always skipped; symlinked
# source directories/manifests are rejected, never followed outside the checkout.
# Package registrations below do not replace each independent runner's graph check.
[layout]
managed_roots = ["apps", "crates", "adapters", "plugins", "sdk", "experiments"]
production_roots = ["apps", "crates", "adapters"]
excluded_directories = ["target", "node_modules", "__pycache__", "build", "dist"]
# Register every explicit [workspace], including combined package/workspace files.
workspace_manifests = [
  "Cargo.toml",
  "experiments/extension-wasm/Cargo.toml",
  "experiments/extension-wasm/author/Cargo.toml",
  "experiments/extension-package/Cargo.toml",
  "experiments/extension-package/author/Cargo.toml",
]

# See ADR 0004: the policy kernel does not execute plugins or write knowledge.
[packages.learning-domain]
manifest = "crates/learning-domain/Cargo.toml"
allowed_dependencies = []

# Serde is restricted to the public wire boundary; serde_json implements bounded JSON entrypoints.
[packages.extension-api]
manifest = "crates/extension-api/Cargo.toml"
allowed_dependencies = ["serde", "serde_json"]
# Review the complete third-party closure, including proc macros/build dependencies.
allowed_transitive_dependencies = ["serde", "serde_core", "serde_derive", "serde_json", "itoa", "memchr", "zmij", "proc-macro2", "quote", "syn", "unicode-ident"]

# Host policy and its example depend only on the public API.
[packages.extension-host]
manifest = "crates/extension-host/Cargo.toml"
allowed_dependencies = ["extension-api"]
allowed_transitive_dependencies = ["extension-api", "serde", "serde_core", "serde_derive", "serde_json", "itoa", "memchr", "zmij", "proc-macro2", "quote", "syn", "unicode-ident"]

# ADR 0005: isolated M-1 experiments. These are NOT production workspace members.
# validate.py checks their normal/dev/build/target declarations and resolved closures
# with the same validate_graph guard; scripts/check_architecture.py checks production only.
[experiments.extension-wasm.packages.qusor-wasm-probe]
manifest = "experiments/extension-wasm/runner/Cargo.toml"
# Wasmi: validated interpreter and budgets; SHA-256: module byte consistency only;
# Serde: bounded package/report formats; API/host: existing public policy boundary.
allowed_dependencies = ["extension-api", "extension-host", "wasmi", "serde", "serde_json", "sha2"]
allowed_transitive_dependencies = [
  "extension-api", "extension-host", "wasmi", "wasmi_collections", "wasmi_core", "wasmi_ir",
  "wasmparser", "spin", "libm", "bitflags", "indexmap", "equivalent", "hashbrown", "foldhash", "string-interner",
  "serde", "serde_core", "serde_derive", "serde_json", "itoa", "memchr", "zmij",
  "proc-macro2", "quote", "syn", "unicode-ident",
  "sha2", "cfg-if", "cpufeatures", "libc", "digest", "block-buffer", "crypto-common", "generic-array", "typenum", "version_check",
]

[experiments.extension-wasm-author.packages.build-plugin]
manifest = "experiments/extension-wasm/author/Cargo.toml"
# WAT assembler and byte digest/JSON packaging only; no QUSOR path dependencies.
allowed_dependencies = ["wat", "sha2", "serde_json"]
allowed_transitive_dependencies = [
  "wat", "wast", "wasm-encoder", "wasmparser", "bumpalo", "leb128fmt", "semver", "unicode-width",
  "bitflags", "indexmap", "equivalent", "hashbrown",
  "serde", "serde_core", "serde_derive", "serde_json", "itoa", "memchr", "zmij",
  "proc-macro2", "quote", "syn", "unicode-ident",
  "sha2", "cfg-if", "cpufeatures", "libc", "digest", "block-buffer", "crypto-common", "generic-array", "typenum", "version_check",
]
# ADR 0007: Linux-only signed container and disabled installation transaction probe.
# Crypto verifies complete package identity; SQLite BLOBs avoid a second file commit;
# fs2 holds the single-writer lock, libc supplies O_NOFOLLOW/O_NONBLOCK input flags.
# Wasmi is reused through the earlier experiment; no production dependency changes.
[experiments.extension-package.packages.qusor-package-probe]
manifest = "experiments/extension-package/Cargo.toml"
allowed_dependencies = ["extension-api", "ed25519-dalek", "sha2", "serde", "serde_json", "fs2", "libc", "rusqlite", "qusor-wasm-probe"]
