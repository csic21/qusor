# Directory inventory keeps independent code out of the production Workspace.
# Hidden directories (including .cache and .local) are always skipped; symlinked
# source directories/manifests are rejected, never followed outside the checkout.
# Package registrations below do not replace each independent runner's graph check.
[layout]
managed_roots = ["apps", "crates", "adapters", "plugins", "sdk", "experiments"]
production_roots = ["apps", "crates", "adapters"]
excluded_directories = ["target", "node_modules", "__pycache__", "build", "dist"]
# Register every explicit [workspace], including combined package/workspace files.
workspace_manifests = [
  "Cargo.toml",
  "experiments/extension-wasm/Cargo.toml",
  "experiments/extension-wasm/author/Cargo.toml",
  "experiments/extension-package/Cargo.toml",
  "experiments/extension-package/author/Cargo.toml",
  "experiments/capture-core/Cargo.toml",
  "experiments/capture-core/author/Cargo.toml",
  "experiments/pdf-provider/Cargo.toml",
  "experiments/nsh-reader/native-host/Cargo.toml",
  "experiments/plugin-ui/Cargo.toml",
  "apps/qusor/provider/Cargo.toml",
  "apps/qusor/bridges/Cargo.toml",
  "apps/qusor/android-jni/Cargo.toml",
  "apps/qusor/native/Cargo.toml",
  "sdk/qusor-sdk/Cargo.toml",
  "plugins/vocab/Cargo.toml",
]

# C-17: the packaged app is assembled under apps/ as independent workspaces so the
# Core foundation workspace and its five-target CI stay free of NSH/native UI.
# Their dependency graphs need their own validate_graph runner (not implemented
# yet); this registration proves production roots, names and manifests only.
[apps.qusor.packages.qusor-pdf-provider]
manifest = "apps/qusor/provider/Cargo.toml"
allowed_dependencies = ["libc", "pdfium-render", "serde", "serde_json", "sha2", "unicode-segmentation"]

[apps.qusor.packages.qusor-app-bridges]
manifest = "apps/qusor/bridges/Cargo.toml"
allowed_dependencies = ["core-api", "extension-api", "extension-host", "learning-application", "learning-ports"]

[apps.qusor.packages.qusor-android-jni]
manifest = "apps/qusor/android-jni/Cargo.toml"
allowed_dependencies = ["jni", "libc"]

[apps.qusor.packages.qusor-app-native]
manifest = "apps/qusor/native/Cargo.toml"
allowed_dependencies = ["capability-composition", "core-api", "extension-api", "extension-host", "extension-package", "extension-runtime-api", "learning-application", "learning-ports", "nsh-core", "png", "qusor-android-jni", "qusor-app-bridges", "qusor-pdf-provider", "runtime-wasm", "serde", "serde_json", "storage-sqlite", "zip"]

[sdk.qusor-sdk.packages.qusor-sdk]
manifest = "sdk/qusor-sdk/Cargo.toml"
allowed_dependencies = ["extension-api", "serde", "serde_json"]
allowed_transitive_dependencies = ["base64", "extension-api", "itoa", "memchr", "proc-macro2", "quote", "serde", "serde_core", "serde_derive", "serde_json", "syn", "unicode-ident", "zmij"]

[plugins.vocab.packages.qusor-vocab]
manifest = "plugins/vocab/Cargo.toml"
allowed_dependencies = ["extension-api", "qusor-sdk", "serde", "serde_json"]
allowed_transitive_dependencies = ["base64", "extension-api", "itoa", "memchr", "proc-macro2", "quote", "qusor-sdk", "serde", "serde_core", "serde_derive", "serde_json", "syn", "unicode-ident", "zmij"]

# See ADR 0004: the policy kernel does not execute plugins or write knowledge.
[packages.learning-domain]
manifest = "crates/learning-domain/Cargo.toml"
allowed_dependencies = []

# Canonical base64 bounds opaque continuation checkpoints; no I/O or authority.
# Serde is restricted to the public wire boundary; serde_json implements bounded JSON entrypoints.
[packages.extension-api]
manifest = "crates/extension-api/Cargo.toml"
allowed_dependencies = ["base64", "serde", "serde_json"]
# Review the complete third-party closure, including proc macros/build dependencies.
allowed_transitive_dependencies = ["base64", "serde", "serde_core", "serde_derive", "serde_json", "itoa", "memchr", "zmij", "proc-macro2", "quote", "syn", "unicode-ident"]

# ADR 0018/0019: authoritative capture/source/anchor and knowledge envelopes; no Host/runtime/SQL/UI.
# Base64 validates canonical binary archive blobs, not external I/O.
[packages.core-api]
manifest = "crates/core-api/Cargo.toml"
allowed_dependencies = ["base64", "serde", "serde_json", "sha2", "unicode-segmentation"]
allowed_transitive_dependencies = ["base64", "block-buffer", "cfg-if", "cpufeatures", "crypto-common", "digest", "generic-array", "itoa", "libc", "memchr", "proc-macro2", "quote", "serde", "serde_core", "serde_derive", "serde_json", "sha2", "syn", "typenum", "unicode-ident", "unicode-segmentation", "version_check", "zmij"]

# ADR 0038: pure capability seams and layered activation planning.
# This crate must remain independent of Host authority, package formats, storage,
# runtimes, NSH and platform APIs.
[packages.capability-composition]
manifest = "crates/capability-composition/Cargo.toml"
allowed_dependencies = []

# ADR 0055: pure durable authority and recovery ports; depends only on extension-api.
[packages.extension-ports]
manifest = "crates/extension-ports/Cargo.toml"
allowed_dependencies = ["extension-api"]
allowed_transitive_dependencies = ["base64", "extension-api", "serde", "serde_core", "serde_derive", "serde_json", "itoa", "memchr", "zmij", "proc-macro2", "quote", "syn", "unicode-ident"]

# ADR 0038 / 0049: capability-composition provides pure acyclic service dependency planning
# for ExtensionRouter (`provides`/`requires`) without introducing storage/runtime/UI deps.
[packages.extension-host]
manifest = "crates/extension-host/Cargo.toml"
allowed_dependencies = ["capability-composition", "extension-api", "extension-ports"]
allowed_transitive_dependencies = ["base64", "capability-composition", "extension-api", "extension-ports", "serde", "serde_core", "serde_derive", "serde_json", "itoa", "memchr", "zmij", "proc-macro2", "quote", "syn", "unicode-ident"]

# ADR 0021: pure signed-package format, immutable content and bound-key verification.
# No installation state, filesystem, Host or execution dependency.
[packages.extension-package]
manifest = "crates/extension-package/Cargo.toml"
allowed_dependencies = ["extension-api", "ed25519-dalek", "serde", "serde_json", "sha2"]
allowed_transitive_dependencies = ["base64", "base64ct", "block-buffer", "cfg-if", "const-oid", "cpufeatures", "crypto-common", "curve25519-dalek", "curve25519-dalek-derive", "der", "digest", "ed25519", "ed25519-dalek", "extension-api", "fiat-crypto", "generic-array", "getrandom", "itoa", "libc", "memchr", "pkcs8", "proc-macro2", "quote", "rand_core", "rustc_version", "semver", "serde", "serde_core", "serde_derive", "serde_json", "sha2", "signature", "spki", "subtle", "syn", "typenum", "unicode-ident", "version_check", "wasi", "zeroize", "zmij"]

# ADR 0022: authority-free runtime port and qualified bounded Wasmi adapter.
# API owns trusted budgets/error/result types; adapter owns interpreter details, no Host/data/FS.
[packages.extension-runtime-api]
manifest = "crates/extension-runtime-api/Cargo.toml"
allowed_dependencies = ["serde"]
allowed_transitive_dependencies = ["serde", "serde_core", "serde_derive", "proc-macro2", "quote", "syn", "unicode-ident"]

