[workspace]
resolver = "3"

[package]
name = "qusor-notes"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false
description = "QUSOR sandboxed notes workspace plugin (Wasm + declarative native UI)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
extension-api = { path = "../../crates/extension-api" }
qusor-sdk = { path = "../../sdk/qusor-sdk" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"
