[package]
name = "extension-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "QUSOR durable extension package, grant material, private pairs and worker leases."

[dependencies]
extension-host = { path = "../../crates/extension-host" }
extension-api = { path = "../../crates/extension-api" }
extension-package = { path = "../../crates/extension-package" }
extension-runtime-api = { path = "../../crates/extension-runtime-api" }
fs2 = "=0.4.3"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[lints]
workspace = true
