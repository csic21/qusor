[package]
name = "runtime-process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "QUSOR platform process identity and confirmed cleanup; no authorization or interpreter."

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
extension-runtime-api = { path = "../../crates/extension-runtime-api" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["std", "process", "event"] }

[lints]
workspace = true

[[test]]
name = "controller"
path = "tests/controller.rs"
harness = false
