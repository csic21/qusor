# 发行流水线（C-17）。tag v* 推送默认创建正式 Release（workflow_dispatch 默认 draft=true）；
# 每次运行前仍须确认：
#   - 仓库 secret NSH_UPDATE_KEY（.local/keys/update.secret 的内容，勿提交）；
#   - 固定 NSH_SHA 与本地基线一致；
#   - macOS 只有 ad hoc 签名、Android 使用 debug keystore 签名，尚未具备商店/公证资格；
#     Linux/Windows/iOS 打包未实测，在验证后逐项打开。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Create a draft release (default true)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  NSH_SHA: 913fd76e1f8434ec6cdf248f4476c1ebe08af19f
  # strip=debuginfo produces a malformed proc-macro dylib for this toolchain.
  CARGO_PROFILE_RELEASE_STRIP: none

jobs:
  package:
    name: Package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        # Add linux / windows entries only after their packaging is verified.
        include:
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: android
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up Java for Android
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components and NDK
        if: matrix.target == 'android'
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ANDROID_HOME / ANDROID_SDK_ROOT is not set on runner" >&2
            exit 1
          fi
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;27.2.12479018"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          if [ "${{ matrix.target }}" = "android" ]; then
            rustup toolchain install stable --profile minimal --target aarch64-linux-android
          fi
      - name: Clone the fixed NSH baseline
        run: |
          git clone --filter=blob:none https://github.com/longbridge/nsh.git experiments/nsh-reader/target/nsh
          git -C experiments/nsh-reader/target/nsh checkout "$NSH_SHA"
      - name: Cache the NSH CLI build
        uses: actions/cache@v4
        with:
          path: experiments/nsh-reader/target/nsh/target
          key: nsh-cli-${{ runner.os }}-${{ matrix.target }}-${{ env.NSH_SHA }}
      - name: Build the NSH CLI
        env:
          CARGO_BUILD_JOBS: "1"
        run: cargo build --locked -p nsh-cli --manifest-path experiments/nsh-reader/target/nsh/Cargo.toml
      - name: Build the NSH Android runtime (arm64-v8a)
        if: matrix.target == 'android'
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo xtask android --release --abi arm64-v8a
        working-directory: experiments/nsh-reader/target/nsh
      - name: Fetch locked dependencies
        # The plugin builders compile their signer offline against the SDK, so
        # the registry has to hold every lock entry before prepare.py runs.
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path apps/qusor/native/Cargo.toml
      - name: Build the packages the app ships
        run: python apps/qusor/prepare.py
      - name: Package the app (macOS)
        if: matrix.target == 'macos'
        run: |
          "$GITHUB_WORKSPACE/experiments/nsh-reader/target/nsh/target/debug/nsh" package \
            --target macos --out dist
        working-directory: apps/qusor
      - name: Package the app (Android arm64-v8a)
        if: matrix.target == 'android'
        env:
          RUSTUP_TOOLCHAIN: stable
          NSH_RUNTIME: ${{ github.workspace }}/experiments/nsh-reader/target/nsh/target
        run: |
          "$GITHUB_WORKSPACE/experiments/nsh-reader/target/nsh/target/debug/nsh" package \
            --target android --abi arm64-v8a --out dist
          python3 package_android_pdfium.py dist/QUSOR.apk --abi arm64-v8a
          version="$(python3 -c 'import json; print(json.load(open("nsh.json"))["version"])')"
          mv dist/QUSOR.apk "dist/QUSOR-${version}-android-arm64-v8a.apk"
        working-directory: apps/qusor
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            apps/qusor/dist/*.tar.gz
            apps/qusor/dist/*.zip
            apps/qusor/dist/*.app
            apps/qusor/dist/*.ipa
            apps/qusor/dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Clone the fixed NSH baseline
        run: |
          git clone --filter=blob:none https://github.com/longbridge/nsh.git experiments/nsh-reader/target/nsh
          git -C experiments/nsh-reader/target/nsh checkout "$NSH_SHA"
      - name: Cache the NSH CLI build
        uses: actions/cache@v4
        with:
          path: experiments/nsh-reader/target/nsh/target
          key: nsh-cli-${{ runner.os }}-${{ env.NSH_SHA }}
          restore-keys: |
            nsh-cli-${{ runner.os }}-
      - name: Build the NSH CLI
        env:
          CARGO_BUILD_JOBS: "1"
        run: cargo build --locked -p nsh-cli --manifest-path experiments/nsh-reader/target/nsh/Cargo.toml
      - name: Write the update key
        env:
          UPDATE_KEY: ${{ secrets.NSH_UPDATE_KEY }}
        run: |
          if [ -z "$UPDATE_KEY" ]; then
            echo "NSH_UPDATE_KEY is missing; run apps/prepare without a signed manifest." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$UPDATE_KEY" > "$RUNNER_TEMP/keys/update.secret"
      - name: Write the update manifest
        run: |
          printf 'See the release notes for this version.\n' > "$RUNNER_TEMP/notes.md"
          # Only the archives this run produced: an unmatched glob reaches the CLI
          # as a literal path and names no platform.
          shopt -s nullglob
          archives=(dist/*.tar.gz dist/*.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "no archive to describe" >&2
            exit 1
          fi
          experiments/nsh-reader/target/nsh/target/debug/nsh update-manifest \
            "${archives[@]}" \
            --entry apps/qusor \
            --notes "$RUNNER_TEMP/notes.md" \
            --key "$RUNNER_TEMP/keys/update.secret" \
            -o dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_DRAFT: ${{ inputs.draft }}
        run: |
          # The tag names the version the manifest offers, for a tag push and a
          # manual run alike (a manual run's ref_name is the branch).
          version="$(python3 -c 'import json,sys; print(json.load(open("dist/latest.json"))["version"])')"
          if [ -z "$version" ]; then
            echo "dist/latest.json names no version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi
          notes="$(python3 - <<'PY_SH'
          import json
          print(json.load(open("dist/latest.json")).get("notes") or "See the release notes for this version.")
          PY_SH
          )"
          printf '%s\n' "$notes" > "$RUNNER_TEMP/release-notes.md"
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip dist/*.ipa dist/*.apk)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "no packaged artifact to publish" >&2
            exit 1
          fi
          draft=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            draft="$REQUESTED_DRAFT"
          fi
          release_args=(
            --target "$GITHUB_SHA"
            --title "QUSOR $version"
            --notes-file "$RUNNER_TEMP/release-notes.md"
          )
          if [ "$draft" = "true" ]; then
            release_args+=(--draft)
          fi
          gh release create "v$version" dist/latest.json dist/latest.json.sig "${assets[@]}" \
            "${release_args[@]}"
